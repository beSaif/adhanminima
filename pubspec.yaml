name: adhanminima
description: "Adhaan: private, ad-free prayer times and Qibla direction."

# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 1.0.14+17

environment:
  sdk: ^3.13.0

dependencies:
  cupertino_icons: ^2.0.0
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon.png"

flutter:
  uses-material-design: true

  assets:
    - assets/

  fonts:
    - family: Halenoir
      fonts:
        - asset: assets/font/Halenoir-Bold.otf
        - asset: assets/font/Halenoir-ThinObl.otf
        - asset: assets/font/Halenoir-UltraLight.otf
        - asset: assets/font/HalenoirText-Regular.otf
          style: italic
